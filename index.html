<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidigi - Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:linear-gradient(135deg,#0f172a,#1e293b);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#1e293b;padding:32px;border-radius:16px;width:100%;max-width:400px;border:1px solid #334155;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.logo{text-align:center;margin-bottom:24px}
.logo h1{color:#3b82f6;font-size:22px;letter-spacing:2px}
.logo p{color:#94a3b8;font-size:12px;margin-top:4px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:12px;font-size:14px}
input:focus{outline:none;border-color:#3b82f6}
.btn{width:100%;padding:14px;background:#3b82f6;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.6}
.err{background:#7f1d1d;color:#fecaca;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="card">
<div class="logo"><h1>SIDIGI TRADING</h1><p>Manager Login</p></div>
<div id="error" class="err"></div>
<input id="email" type="email" placeholder="Email address" value="admin123@gmail.com">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn" class="btn">LOGIN TO SYSTEM</button>
<p style="text-align:center;color:#64748b;font-size:11px;margin-top:16px">Protected by Firebase Auth</p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyDrAyZXWqD3ymYQPxendW9lkynoSiTa0ls",authDomain:"sidigi-general-trading.firebaseapp.com",projectId:"sidigi-general-trading",storageBucket:"sidigi-general-trading.firebasestorage.app",messagingSenderId:"1054004122944",appId:"1:1054004122944:web:c66be702aed7f53f1dd6a5"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
onAuthStateChanged(auth,(user)=>{ if(user){ window.location.replace("./dashboard.html"); } });
const emailEl=document.getElementById("email"),passEl=document.getElementById("password"),btn=document.getElementById("loginBtn"),errEl=document.getElementById("error");
btn.addEventListener("click",async()=>{
 const email=emailEl.value.trim(),password=passEl.value;
 if(!email||!password){ errEl.style.display="block";errEl.textContent="Enter email and password";return; }
 btn.disabled=true;btn.textContent="Signing in...";errEl.style.display="none";
 try{ await signInWithEmailAndPassword(auth,email,password); window.location.replace("./dashboard.html"); }
 catch(e){ errEl.style.display="block";errEl.textContent=e.code+" : "+e.message; btn.disabled=false;btn.textContent="LOGIN TO SYSTEM"; }
});
</script>
</body>
</html>
