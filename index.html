<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidigi General Trading - Login</title>
<meta name="theme-color" content="#0f172a">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#1e293b;padding:32px;border-radius:16px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.4);border:1px solid #334155}
h1{text-align:center;margin-bottom:8px;letter-spacing:2px}
.sub{text-align:center;color:#94a3b8;margin-bottom:24px;font-size:14px}
input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:12px;font-size:16px}
input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.2)}
button{width:100%;padding:12px;background:#3b82f6;border:none;border-radius:8px;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
button:hover{background:#2563eb}
button:disabled{opacity:.6;cursor:not-allowed}
.error{background:#450a0a;color:#fecaca;padding:10px;border-radius:8px;margin-bottom:12px;display:none;font-size:13px;border:1px solid #7f1d1d;word-break:break-word}
.success{background:#052e16;color:#bbf7d0;padding:10px;border-radius:8px;margin-bottom:12px;display:none;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <h1>SIDIGI</h1>
  <p class="sub">General Trading - Manager Login</p>
  <div id="error" class="error"></div>
  <div id="success" class="success"></div>
  <input id="email" type="email" placeholder="Email address" autocomplete="email" required>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button id="loginBtn">LOGIN TO SYSTEM</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDrAyZXWqD3ymYQPxendW9lkynoSiTa0ls",
  authDomain: "sidigi-general-trading.firebaseapp.com",
  projectId: "sidigi-general-trading",
  storageBucket: "sidigi-general-trading.firebasestorage.app",
  messagingSenderId: "1054004122944",
  appId: "1:1054004122944:web:c66be702aed7f53f1dd6a5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const emailEl = document.getElementById('email');
const passEl = document.getElementById('password');
const btn = document.getElementById('loginBtn');
const errEl = document.getElementById('error');
const okEl = document.getElementById('success');

function showError(msg){ okEl.style.display='none'; errEl.textContent=msg; errEl.style.display='block'; }
function showSuccess(msg){ errEl.style.display='none'; okEl.textContent=msg; okEl.style.display='block'; }

onAuthStateChanged(auth, (user) => {
  if (user) {
    showSuccess("Logged in, redirecting...");
    setTimeout(()=> window.location.replace("./dashboard.html"), 500);
  }
});

btn.addEventListener('click', async () => {
  const email = emailEl.value.trim().toLowerCase();
  const password = passEl.value;

  if(!email || !password){ showError("Please enter email and password"); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showError("Invalid email format"); return; }
  if(password.length < 6){ showError("Password must be at least 6 characters"); return; }

  btn.disabled = true;
  btn.textContent = "Signing in...";
  errEl.style.display='none';

  try {
    await signInWithEmailAndPassword(auth, email, password);
    showSuccess("Success!");
  } catch (e) {
    let msg = "Login failed";
    if(e.code === 'auth/invalid-credential') msg = "Wrong email or password. Check Firebase > Authentication > Users";
    else if(e.code === 'auth/invalid-email') msg = "Invalid email";
    else if(e.code === 'auth/user-disabled') msg = "Account disabled";
    else if(e.code === 'auth/too-many-requests') msg = "Too many attempts, wait a minute";
    else if(e.code === 'auth/network-request-failed') msg = "Network error, check connection";
    else msg = e.code;
    showError(msg);
    btn.disabled = false;
    btn.textContent = "LOGIN TO SYSTEM";
  }
});

passEl.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter') btn.click(); });
</script>
</body>
</html>
