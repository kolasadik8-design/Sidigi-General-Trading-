<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIDIGI GENERAL TRADING - Login v8</title><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#C1272D">
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui;background:#f8fafc;min-height:100vh;display:flex;flex-direction:column}.header{background:#fff;padding:14px 20px;position:relative;border-bottom:1px solid #e2e8f0}.header::after{content:"";position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#C1272D 40%,#00A8D8 40%)}.head-inner{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}.logo{width:50px;height:36px;background:linear-gradient(135deg,#00A8D8 45%,#C1272D 45%);clip-path:polygon(0 50%,25% 0,100% 0,75% 100%,0 100%)}.company{color:#C1272D;font-weight:800;font-size:15px}.company small{display:block;color:#334155;font-size:9px}.main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:410px;background:#fff;border-radius:14px;padding:28px;box-shadow:0 12px 32px rgba(0,0,0,.08);border-top:5px solid #C1272D}.err{display:none;background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d;padding:10px;border-radius:8px;font-size:11px;margin-bottom:12px;word-break:break-all}label{font-size:10px;font-weight:700;color:#475569;margin-bottom:6px;display:block}input{width:100%;padding:12px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:12px;outline:none;font-size:13px}.btn{width:100%;padding:12px;background:#C1272D;border:none;border-radius:8px;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6}.footer{background:#fff;border-top:3px solid #C1272D;padding:10px 20px;font-size:10px;color:#334155}.footer-inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}</style></head><body>
<div class="header"><div class="head-inner"><div class="logo"></div><div class="company">SIDIGI GENERAL TRADING CO. LTD<small>GENERAL TRADING • TRAVEL • AIR CARGO - USD RATE</small></div></div></div>
<div class="main"><div class="card"><h2 style="text-align:center;letter-spacing:1px">OPERATIONS LOGIN v8</h2><p style="text-align:center;color:#64748b;font-size:11px;margin:6px 0 18px">SECURE • USD RATE • EMPLOYEE TRACKING</p><div id="err" class="err"></div><label>EMAIL ADDRESS</label><input id="email" type="email" autocomplete="email"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="btn">LOGIN →</button><small style="display:block;text-align:center;margin-top:10px;color:#64748b">Admin creates employee accounts. Disabled accounts cannot login.</small></div></div>
<div class="footer"><div class="footer-inner"><span>📞 +211 915 456 456</span><span>📍 Juba International Airport</span><span>✉️ sagishad@gmail.com</span></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDrAyZXWqD3ymYQPxendW9lkynoSiTa0ls",authDomain:"sidigi-general-trading.firebaseapp.com",projectId:"sidigi-general-trading",storageBucket:"sidigi-general-trading.firebasestorage.app",messagingSenderId:"1054004122944",appId:"1:1054004122944:web:c66be702aed7f53f1dd6a5"};
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);
const errEl=document.getElementById('err'),btn=document.getElementById('loginBtn');
onAuthStateChanged(auth, async(u)=>{ if(!u) return; try{ const d=await getDoc(doc(db,"users",u.uid)); if(d.exists() && d.data().active===false){ await auth.signOut(); errEl.style.display='block'; errEl.textContent='ACCOUNT DISABLED BY ADMIN'; return; } window.location.replace("./dashboard.html?v=v8-secure-final"); }catch(e){ window.location.replace("./dashboard.html?v=v8-secure-final"); } });
btn.addEventListener('click', async()=>{ const email=document.getElementById('email').value.trim(), pass=document.getElementById('password').value; if(!email||!pass){ errEl.style.display='block'; errEl.textContent='Enter email and password'; return; } if(pass.length<6){ errEl.style.display='block'; errEl.textContent='Password min 6 chars'; return; } btn.disabled=true; btn.textContent='AUTHENTICATING...'; errEl.style.display='none'; try{ const cred=await signInWithEmailAndPassword(auth,email,pass); const d=await getDoc(doc(db,"users",cred.user.uid)); if(d.exists() && d.data().active===false){ await auth.signOut(); throw new Error('ACCOUNT DISABLED BY ADMIN'); } window.location.replace("./dashboard.html?v=v8-secure-final"); }catch(e){ errEl.style.display='block'; errEl.textContent=(e.code?e.code.replace('auth/','').toUpperCase()+' - ':'')+e.message; btn.disabled=false; btn.textContent='LOGIN →'; } });
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script></body></html>
