<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIDIGI Login</title>
<style>:root{--red:#C1272D;--blue:#00AEEF;--dark:#0F2F5A}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui;background:#F1F5F9;display:flex;align-items:center;justify-content:center;min-height:100vh}.card{background:#fff;border-radius:22px;padding:24px;width:92%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.1);border-top:4px solid var(--red)}input,select{width:100%;padding:14px 16px;border:1.8px solid #E2E8F0;border-radius:14px;font-size:14px;margin-bottom:10px;outline:none}input:focus{border-color:var(--red)}.btn{width:100%;padding:14px;background:var(--red);color:#fff;border:none;border-radius:14px;font-weight:800;cursor:pointer}</style></head><body>
<div class="card">
<div style="text-align:center;margin-bottom:16px;display:flex;align-items:center;gap:10px;justify-content:center">
<svg width="40" height="40" viewBox="0 0 120 100"><path d="M6 48 L26 38 L32 44 L14 56 Z" fill="#00AEEF"/><path d="M32 18 L58 4 L66 20 L48 34 Z" fill="#C1272D"/><path d="M46 26 L78 8 L68 26 L46 40 Z" fill="#00AEEF"/><path d="M28 52 L62 34 L74 48 L38 68 Z" fill="#C1272D"/></svg>
<div style="text-align:left"><b style="color:var(--red);font-size:18px">SIDIGI</b><br><small style="color:var(--dark);font-weight:800">GENERAL TRADING CO. LTD</small></div>
</div>
<h3 style="text-align:center;color:var(--dark);margin-bottom:12px">Employee Login</h3>
<input id="empName" placeholder="Employee Full Name *">
<input id="empId" placeholder="ID Card No *">
<select id="empRole"><option value="Operations">Operations</option><option value="Finance">Finance</option><option value="Branch Staff">Branch Staff</option><option value="Supervisor">Supervisor</option><option value="Weight Clerk">Weight Clerk</option></select>
<select id="empBranch"><option value="Juba Main">Juba Main</option><option value="Malakal">Malakal</option><option value="Wau">Wau</option><option value="Rumbek">Rumbek</option><option value="Maban">Maban</option><option value="Bor">Bor</option></select>
<button class="btn" onclick="login()">Login to Dashboard</button>
<p style="font-size:10px;color:#64748b;text-align:center;margin-top:10px">Your name will be automatically attached to every cargo & ticket you create</p>
</div>
<script>
const esc=s=>{const d=document.createElement('div'); d.textContent=s||''; return d.textContent;};
function login(){
const name=esc(document.getElementById('empName').value.trim()), id=esc(document.getElementById('empId').value.trim()), role=esc(document.getElementById('empRole').value), branch=esc(document.getElementById('empBranch').value);
if(!name||!id) return alert('Enter Name and ID Card No');
const user={name, id, role, branch, loginAt:new Date().toISOString()};
localStorage.setItem('sg_currentUser', JSON.stringify(user));
location.href='./dashboard.html?v=sidigi-local-employee-08-10-2026';
}
</script></body></html>
