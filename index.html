<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIDIGI - Login v9.5 Golden</title>
<style>:root{--red:#C1272D;--blue:#00A8D8;--dark:#0F2F5A;--gold:#FFD700;--gold2:#D4AF37}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui;background:linear-gradient(135deg,#f1f5f9 0%,#e2e8f0 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.card{background:#fff;width:100%;max-width:400px;border-radius:18px;padding:28px;box-shadow:0 20px 40px rgba(0,0,0,.12);border-top:4px solid var(--red);position:relative;overflow:hidden}.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}.logo{text-align:center;margin-bottom:20px}.logo-icon{width:54px;height:42px;margin:0 auto 10px;background:linear-gradient(135deg,#00A8D8 45%,#C1272D 45%);clip-path:polygon(0 50%,25% 0,100% 0,75% 100%,0 100%)}input{width:100%;padding:14px;border:1.5px solid #cbd5e1;border-radius:12px;margin-bottom:12px;outline:none;font-size:14px}input:focus{border-color:var(--blue)}.btn{width:100%;padding:14px;background:var(--red);color:#fff;border:none;border-radius:12px;font-weight:800;cursor:pointer;font-size:15px;margin-top:8px}.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000}.gold-sig{background:linear-gradient(90deg,#000 0%,var(--gold) 50%,#000 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:900}.gold-bar{height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));margin:12px 0;border-radius:2px}.err{background:#fef2f2;color:#dc2626;padding:10px;border-radius:8px;font-size:12px;margin-bottom:12px;display:none}.ok{background:#f0fdf4;color:#16A34A;padding:10px;border-radius:8px;font-size:12px;margin-bottom:12px;display:none}</style></head><body>
<div class="card">
<div class="logo"><div class="logo-icon"></div><h2 style="color:var(--red);font-weight:900">SIDIGI <span style="color:var(--blue)">GENERAL TRADING</span></h2><small style="color:#64748b">Cargo & Travel System</small><div class="gold-bar"></div><div class="gold-sig" style="font-size:11px">✨ v9.5 Golden - Eng. Mutawakil ✨</div></div>
<div id="err" class="err"></div><div id="ok" class="ok"></div>
<input id="email" type="email" placeholder="Email e.g. admin@sidigi.com"><input id="pass" type="password" placeholder="Password">
<button class="btn" id="loginBtn">Login - Secure Check Active</button>
<div style="text-align:center;margin-top:14px;font-size:11px;color:#64748b">Admin creates logins inside dashboard<br>Disabled accounts cannot login<br><span class="gold-sig">Secure v9.5 - USD Separate</span></div>
<div class="gold-bar"></div><div style="text-align:center;font-size:9px;color:#94a3b8">Developed by Eng. Mutawakil - Golden Signature Edition<br>Juba International Airport • +211 915 456 456</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDrAyZXWqD3ymYQPxendW9lkynoSiTa0ls",authDomain:"sidigi-general-trading.firebaseapp.com",projectId:"sidigi-general-trading",storageBucket:"sidigi-general-trading.firebasestorage.app",messagingSenderId:"1054004122944",appId:"1:1054004122944:web:c66be702aed7f53f1dd6a5"};
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);
const emailEl=document.getElementById('email'), passEl=document.getElementById('pass'), errEl=document.getElementById('err'), okEl=document.getElementById('ok');
function showErr(m){ errEl.textContent=m; errEl.style.display='block'; okEl.style.display='none'; } function showOk(m){ okEl.textContent=m; okEl.style.display='block'; errEl.style.display='none'; }
onAuthStateChanged(auth, async(u)=>{ if(u){ try{ const snap=await getDoc(doc(db,"users",u.uid)); if(snap.exists() && snap.data().active===false){ showErr('Account disabled by Admin. Contact manager.'); return; } }catch(e){} location.replace('./dashboard.html?v=v9.5-golden-full'); } });
document.getElementById('loginBtn').addEventListener('click', async()=>{ const email=emailEl.value.trim(), pass=passEl.value; if(!email.includes('@')||!pass) return showErr('Enter email and password'); showOk('Checking...'); try{ const cred=await signInWithEmailAndPassword(auth,email,pass); try{ const snap=await getDoc(doc(db,"users",cred.user.uid)); if(snap.exists() && snap.data().active===false){ showErr('Account disabled by Admin/Manager'); return; } }catch(e){} showOk('Success - Loading v9.5...'); setTimeout(()=>location.replace('./dashboard.html?v=v9.5-golden-full'),600); }catch(e){ if(e.code==='auth/invalid-credential') showErr('Wrong email or password'); else if(e.code==='auth/user-disabled') showErr('Account disabled'); else showErr(e.message); } });
</script></body></html>
