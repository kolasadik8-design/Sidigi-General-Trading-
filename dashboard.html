<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidigi - Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#0f172a;color:#fff;min-height:100vh}
.header{background:#1e293b;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;flex-wrap:wrap;gap:12px}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600}
.btn-out{background:#7f1d1d;color:#fff}
.btn-out:hover{background:#991b1b}
.container{padding:24px;max-width:1100px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.card{background:#1e293b;padding:20px;border-radius:12px;border:1px solid #334155}
.card h3{color:#94a3b8;font-size:12px;margin-bottom:8px}
.card .val{font-size:26px;font-weight:700}
.box{background:#1e293b;border-radius:12px;border:1px solid #334155;padding:20px}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;margin-bottom:10px}
button.primary{width:100%;padding:12px;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <h2>SIDIGI GENERAL TRADING</h2>
  <div>
    <span id="userEmail" style="color:#94a3b8;margin-right:12px;font-size:13px"></span>
    <button id="logoutBtn" class="btn btn-out">Logout</button>
  </div>
</div>

<div class="container">
  <div class="grid">
    <div class="card"><h3>Total Orders</h3><div class="val" id="orders">0</div></div>
    <div class="card"><h3>Products</h3><div class="val" id="products">0</div></div>
    <div class="card"><h3>Customers</h3><div class="val" id="customers">0</div></div>
    <div class="card"><h3>Revenue</h3><div class="val">$0</div></div>
  </div>

  <div class="box">
    <h3 style="margin-bottom:12px">Manager Panel</h3>
    <p style="color:#94a3b8;font-size:14px;margin-bottom:16px">Welcome to Sidigi Dashboard. This is your secure manager area.</p>
    <input id="pname" placeholder="Product name">
    <input id="pprice" placeholder="Price" type="number">
    <textarea id="pdesc" placeholder="Description"></textarea>
    <button class="primary" id="addBtn">Add Product (Demo)</button>
    <p id="msg" style="margin-top:12px;color:#22c55e;display:none">Product added (demo)!</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDrAyZXWqD3ymYQPxendW9lkynoSiTa0ls",
  authDomain: "sidigi-general-trading.firebaseapp.com",
  projectId: "sidigi-general-trading",
  storageBucket: "sidigi-general-trading.firebasestorage.app",
  messagingSenderId: "1054004122944",
  appId: "1:1054004122944:web:c66be702aed7f53f1dd6a5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Protect page - if not logged in, go to login
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.replace("./index.html");
  } else {
    document.getElementById("userEmail").textContent = user.email;
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.replace("./index.html");
});

document.getElementById("addBtn").addEventListener("click", () => {
  const name = document.getElementById("pname").value;
  if(!name){ alert("Enter product name"); return; }
  document.getElementById("msg").style.display="block";
  document.getElementById("pname").value="";
  document.getElementById("pprice").value="";
  document.getElementById("pdesc").value="";
  setTimeout(()=> document.getElementById("msg").style.display="none", 2000);
});
</script>
</body>
</html>
