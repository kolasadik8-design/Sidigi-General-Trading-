<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidigi - Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui;background:#0f172a;color:#fff;min-height:100vh}
header{background:#1e293b;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;position:sticky;top:0;z-index:10}
.logo{color:#3b82f6;font-weight:800;letter-spacing:1px}
.btn{padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:600}
.btn-blue{background:#3b82f6;color:#fff}
.btn-red{background:#ef4444;color:#fff}
.btn-green{background:#22c55e;color:#fff}
.container{padding:20px;max-width:1100px;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.card{background:#1e293b;padding:18px;border-radius:12px;border:1px solid #334155}
.card h3{font-size:13px;color:#94a3b8;margin-bottom:6px}
.card p{font-size:22px;font-weight:800}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:10px 16px;background:#1e293b;border:1px solid #334155;border-radius:8px;cursor:pointer}
.tab.active{background:#3b82f6;border-color:#3b82f6}
.section{display:none}
.section.active{display:block}
input,select{width:100%;padding:12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#fff;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:12px;overflow:hidden}
th,td{padding:10px;text-align:left;border-bottom:1px solid #334155;font-size:13px}
th{color:#94a3b8;background:#0f172a}
</style>
</head>
<body>
<header>
<div class="logo">SIDIGI TRADING - DASHBOARD</div>
<div style="display:flex;gap:8px">
<span id="userEmail" style="color:#94a3b8;font-size:12px;padding:8px"></span>
<button id="logout" class="btn btn-red">Logout</button>
</div>
</header>

<div class="container">
<div class="cards">
<div class="card"><h3>TOTAL PRODUCTS</h3><p id="totalProducts">0</p></div>
<div class="card"><h3>TOTAL SALES TODAY</h3><p id="totalSales">0 SDG</p></div>
<div class="card"><h3>TOTAL STOCK VALUE</h3><p id="stockValue">0 SDG</p></div>
<div class="card"><h3>LOW STOCK</h3><p id="lowStock">0</p></div>
</div>

<div class="tabs">
<div class="tab active" data-tab="products">Products</div>
<div class="tab" data-tab="sales">Sales</div>
<div class="tab" data-tab="expenses">Expenses</div>
<div class="tab" data-tab="report">Report</div>
</div>

<div id="products" class="section active">
<div class="row">
<input id="pName" placeholder="Product Name">
<input id="pQty" type="number" placeholder="Quantity">
</div>
<div class="row">
<input id="pBuy" type="number" placeholder="Buy Price">
<input id="pSell" type="number" placeholder="Sell Price">
</div>
<button id="addProduct" class="btn btn-blue" style="width:100%;margin-bottom:14px">Add Product</button>
<table><thead><tr><th>Name</th><th>Qty</th><th>Buy</th><th>Sell</th><th>Action</th></tr></thead><tbody id="productsTable"></tbody></table>
</div>

<div id="sales" class="section">
<select id="saleProduct"></select>
<div class="row">
<input id="saleQty" type="number" placeholder="Quantity to sell">
<input id="salePrice" type="number" placeholder="Sell price (auto)">
</div>
<button id="addSale" class="btn btn-green" style="width:100%;margin-bottom:14px">Record Sale</button>
<table><thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Total</th></tr></thead><tbody id="salesTable"></tbody></table>
</div>

<div id="expenses" class="section">
<div class="row">
<input id="eName" placeholder="Expense name">
<input id="eAmount" type="number" placeholder="Amount">
</div>
<button id="addExpense" class="btn btn-blue" style="width:100%;margin-bottom:14px">Add Expense</button>
<table><thead><tr><th>Date</th><th>Name</th><th>Amount</th></tr></thead><tbody id="expensesTable"></tbody></table>
</div>

<div id="report" class="section">
<div class="card"><p id="reportText">No data yet</p></div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyDrAyZXWqD3ymYQPxendW9lkynoSiTa0ls",authDomain:"sidigi-general-trading.firebaseapp.com",projectId:"sidigi-general-trading",storageBucket:"sidigi-general-trading.firebasestorage.app",messagingSenderId:"1054004122944",appId:"1:1054004122944:web:c66be702aed7f53f1dd6a5"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

onAuthStateChanged(auth,(user)=>{
 if(!user){ window.location.replace("./index.html"); return; }
 document.getElementById("userEmail").textContent=user.email;
 init();
});

document.getElementById("logout").onclick=async()=>{ await signOut(auth); location.href="./index.html"; };

// Tabs
document.querySelectorAll(".tab").forEach(t=>{
 t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  document.getElementById(t.dataset.tab).classList.add("active");
 };
});

let products=JSON.parse(localStorage.getItem("sidigi_products")||"[]");
let sales=JSON.parse(localStorage.getItem("sidigi_sales")||"[]");
let expenses=JSON.parse(localStorage.getItem("sidigi_expenses")||"[]");

function init(){ renderProducts(); renderSales(); renderExpenses(); updateStats(); }

function save(){ localStorage.setItem("sidigi_products",JSON.stringify(products)); localStorage.setItem("sidigi_sales",JSON.stringify(sales)); localStorage.setItem("sidigi_expenses",JSON.stringify(expenses)); updateStats(); }

function updateStats(){
 document.getElementById("totalProducts").textContent=products.length;
 let todaySales=sales.filter(s=>new Date(s.date).toDateString()===new Date().toDateString()).reduce((a,b)=>a+b.total,0);
 document.getElementById("totalSales").textContent=todaySales+" SDG";
 let stockVal=products.reduce((a,b)=>a+(b.qty*b.buy),0);
 document.getElementById("stockValue").textContent=stockVal+" SDG";
 document.getElementById("lowStock").textContent=products.filter(p=>p.qty<5).length;
 document.getElementById("reportText").innerHTML=`Total Products: ${products.length}<br>Total Sales Records: ${sales.length}<br>Total Expenses: ${expenses.reduce((a,b)=>a+b.amount,0)} SDG<br>Total Profit: ${sales.reduce((a,b)=>a+b.total,0)-expenses.reduce((a,b)=>a+b.amount,0)} SDG`;
}

function renderProducts(){
 const tb=document.getElementById("productsTable"); const sel=document.getElementById("saleProduct");
 tb.innerHTML=""; sel.innerHTML='<option value="">Select Product</option>';
 products.forEach((p,i)=>{
  tb.innerHTML+=`<tr><td>${p.name}</td><td>${p.qty}</td><td>${p.buy}</td><td>${p.sell}</td><td><button onclick="delProd(${i})" class="btn btn-red" style="padding:4px 8px">Del</button></td></tr>`;
  sel.innerHTML+=`<option value="${i}">${p.name} (${p.qty})</option>`;
 });
}
window.delProd=(i)=>{ if(confirm("Delete?")){ products.splice(i,1); save(); renderProducts(); } };

document.getElementById("addProduct").onclick=()=>{
 const name=document.getElementById("pName").value.trim(), qty=parseInt(document.getElementById("pQty").value), buy=parseFloat(document.getElementById("pBuy").value), sell=parseFloat(document.getElementById("pSell").value);
 if(!name||isNaN(qty)||isNaN(buy)||isNaN(sell)) return alert("Fill all fields");
 products.push({name,qty,buy,sell}); save(); renderProducts();
 document.getElementById("pName").value=""; document.getElementById("pQty").value=""; document.getElementById("pBuy").value=""; document.getElementById("pSell").value="";
};

document.getElementById("saleProduct").onchange=(e)=>{
 const p=products[e.target.value]; if(p) document.getElementById("salePrice").value=p.sell;
};

document.getElementById("addSale").onclick=()=>{
 const idx=document.getElementById("saleProduct").value, qty=parseInt(document.getElementById("saleQty").value);
 if(idx===""||isNaN(qty)) return alert("Select product and qty");
 const prod=products[idx];
 if(qty>prod.qty) return alert("Not enough stock");
 const price=parseFloat(document.getElementById("salePrice").value);
 prod.qty-=qty; sales.push({date:new Date().toISOString(),name:prod.name,qty,total:qty*price});
 save(); renderProducts(); renderSales();
 document.getElementById("saleQty").value="";
};

function renderSales(){
 const tb=document.getElementById("salesTable"); tb.innerHTML="";
 sales.slice().reverse().forEach(s=>{ tb.innerHTML+=`<tr><td>${new Date(s.date).toLocaleDateString()}</td><td>${s.name}</td><td>${s.qty}</td><td>${s.total}</td></tr>`; });
}

document.getElementById("addExpense").onclick=()=>{
 const name=document.getElementById("eName").value.trim(), amount=parseFloat(document.getElementById("eAmount").value);
 if(!name||isNaN(amount)) return alert("Fill fields");
 expenses.push({date:new Date().toISOString(),name,amount}); save(); renderExpenses();
 document.getElementById("eName").value=""; document.getElementById("eAmount").value="";
};
function renderExpenses(){
 const tb=document.getElementById("expensesTable"); tb.innerHTML="";
 expenses.slice().reverse().forEach(e=>{ tb.innerHTML+=`<tr><td>${new Date(e.date).toLocaleDateString()}</td><td>${e.name}</td><td>${e.amount}</td></tr>`; });
}
</script>
</body>
</html>
