<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIDIGI V9.6 Golden</title><style>:root{--red:#C1272D;--blue:#00A8D8;--dark:#1a1a2e;--gold:#FFD700}body{font-family:Arial;margin:0;background:#f1f5f9}.topbar{background:var(--dark);color:#fff;padding:12px;display:flex;justify-content:space-between}.card{background:#fff;padding:16px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08);border-left:5px solid var(--red)}.btn{background:var(--red);color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:bold}.btn-blue{background:var(--blue)}.btn-dark{background:var(--dark)}input,select{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ccc}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:6px;text-align:center}</style></head><body>
<div class="topbar"><b>SIDIGI GENERAL TRADING <small style="color:var(--gold)">v9.6</small></b><div><span id="userInfo"></span> <button id="logoutBtn" class="btn btn-dark">Logout</button></div></div>
<div style="max-width:1100px;margin:0 auto;padding:12px">
<div class="card"><h3>📦 Book Cargo</h3><select id="cargoDest"></select><input id="sName" placeholder="Sender Name *"><input id="rName" placeholder="Receiver Name *"><input id="weight" type="number" placeholder="Weight kg"><div>Price $<span id="cargoPrice">0</span> Total $<span id="cargoTotal">0</span></div><button class="btn" id="bookCargoBtn">Book Cargo</button></div>
<div class="card" style="border-left-color:var(--blue)"><h3>✈️ Issue Ticket</h3><input id="pName" placeholder="Passenger Name *"><input id="tPrice" type="number" placeholder="Price"><button class="btn btn-blue" id="issueTicketBtn">Issue Ticket</button></div>
<div class="card"><input id="searchBox" placeholder="Search..."><button class="btn btn-dark" onclick="renderLists()">Search</button></div>
<div id="lists"></div>
<div id="financeArchive" class="card" style="display:none;border:2px solid var(--gold)"><h3 style="color:var(--red)">📊 أرشيف الحسابات - مالية ومدير فقط</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="genReport('weekly')">أسبوعي</button><button class="btn" onclick="genReport('monthly')">شهري</button><button class="btn" onclick="genReport('yearly')">سنوي</button><button class="btn btn-blue" onclick="genReport('cargoTrip')">تفصيلي شحن: الشركة/اليوم/شحنا/السعر/دفعنا/الباقي</button><button class="btn btn-blue" onclick="genReport('ticketTrip')">تفصيلي تذاكر</button></div><div id="reportArea" style="margin-top:12px;background:#f9fafb;padding:10px;border-radius:8px"></div><button class="btn" onclick="printReportPDF()">🖨️ PDF</button></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";import {getFirestore,collection,addDoc,getDocs,deleteDoc,doc,updateDoc,query,orderBy} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDrAyZXWqD3ymYQPxendW9lkynoSiTa0ls"...كمل مفتاحك من History",authDomain:"sidigi-....firebaseapp.com",projectId:"sidigi-...",appId:"1:...."};const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}let currentUser=null,currentRole='operations',ships=[],tickets=[];const defaultCargo=[{name:"Maban",price:1.5},{name:"Renk",price:1.5},{name:"Malakal",price:2}];
onAuthStateChanged(auth,async(u)=>{if(!u){location.href='login.html';return}currentUser=u;const snap=await getDocs(collection(db,"users"));let me=snap.docs.find(d=>d.id===u.uid);if(me)currentRole=me.data().role||'operations';document.getElementById('userInfo').textContent=`${u.email} (${currentRole})`;if(['admin','finance','manager'].includes(currentRole))document.getElementById('financeArchive').style.display='block';loadDestinations();loadOps();});
document.getElementById('logoutBtn').addEventListener('click',()=>signOut(auth));
async function loadDestinations(){try{const s=await getDocs(collection(db,"destinations"));let list=s.docs.map(d=>({id:d.id,...d.data()}));if(list.length===0)list=defaultCargo;document.getElementById('cargoDest').innerHTML=list.map(d=>`<option value="${d.name}" data-price="${d.price}">${d.name} $${d.price}/kg</option>`).join('');calcCargo();}catch(e){}}
window.calcCargo=()=>{const sel=document.getElementById('cargoDest');const price=Number(sel.options[sel.selectedIndex]?.dataset.price||0);const w=Number(document.getElementById('weight').value||0);document.getElementById('cargoPrice').textContent=price;document.getElementById('cargoTotal').textContent=(price*w).toFixed(2)};document.getElementById('cargoDest').addEventListener('change',calcCargo);document.getElementById('weight').addEventListener('input',calcCargo);
document.getElementById('bookCargoBtn').addEventListener('click',async()=>{const data={cargoDest:document.getElementById('cargoDest').value,sName:document.getElementById('sName').value,rName:document.getElementById('rName').value,weight:Number(document.getElementById('weight').value),total:Number(document.getElementById('cargoTotal').textContent),price:Number(document.getElementById('cargoPrice').textContent),cost:0,paid:0,company:document.getElementById('cargoDest').value,date:new Date().toISOString().split('T')[0],financeNote:"",createdAt:new Date()};if(!data.sName||!data.rName||!data.weight)return alert('Fill');await addDoc(collection(db,"cargos"),data);loadOps();});
document.getElementById('issueTicketBtn').addEventListener('click',async()=>{const data={pName:document.getElementById('pName').value,price:Number(document.getElementById('tPrice').value),cost:0,paid:0,company:"-",date:new Date().toISOString().split('T')[0],financeNote:"",createdAt:new Date()};await addDoc(collection(db,"tickets"),data);loadOps();});
async function loadOps(){try{const s=await getDocs(query(collection(db,"cargos"),orderBy("createdAt","desc")));ships=s.map(d=>({id:d.id,...d.data()}));s.forEach?s:ships=snap.docs.map(d=>({id:d.id,...d.data()}));const q=await getDocs(query(collection(db,"cargos"),orderBy("createdAt","desc")));ships=q.docs.map(d=>({id:d.id,...d.data()}));const t=await getDocs(query(collection(db,"tickets"),orderBy("createdAt","desc")));tickets=t.docs.map(d=>({id:d.id,...d.data()}));renderLists();}catch(e){}}
window.renderLists=()=>{const qq=(document.getElementById('searchBox').value||'').toLowerCase();let html=`<div class="card"><h3>Cargos (${ships.length})</h3>`+ships.filter(s=>JSON.stringify(s).toLowerCase().includes(qq)).map(s=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:6px"><span>${escapeHtml(s.sName)}→${escapeHtml(s.rName)} | ${s.cargoDest} | $${s.total} | ${s.date}</span><span><button onclick="cancelCargo('${s.id}')">X</button></span></div>`).join('')+`</div>`;html+=`<div class="card"><h3>Tickets (${tickets.length})</h3>`+tickets.filter(t=>JSON.stringify(t).toLowerCase().includes(qq)).map(t=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:6px"><span>${escapeHtml(t.pName)} | $${t.price} | ${t.date}</span><span><button onclick="cancelTicket('${t.id}')">X</button></span></div>`).join('')+`</div>`;document.getElementById('lists').innerHTML=html};
window.cancelCargo=async(id)=>{if(!confirm('Delete?'))return;await deleteDoc(doc(db,"cargos",id));loadOps();};window.cancelTicket=async(id)=>{if(!confirm('Delete?'))return;await deleteDoc(doc(db,"tickets",id));loadOps();};
window.genReport=async(type)=>{if(!['admin','finance','manager'].includes(currentRole)){alert('⛔ للمالية والمدير فقط');return}const cSnap=await getDocs(collection(db,"cargos"));const tSnap=await getDocs(collection(db,"tickets"));let cargos=[];cSnap.forEach(d=>cargos.push({id:d.id,...d.data()}));let ticketsArr=[];tSnap.forEach(d=>ticketsArr.push({id:d.id,...d.data()}));let now=new Date();let html="";if(['weekly','monthly','yearly'].includes(type)){let fn=(d)=>{let dt=d.createdAt?.toDate?d.createdAt.toDate():new Date(d.date);if(type==='weekly')return(now-dt)/(1000*60*60*24)<=7;if(type==='monthly')return dt.getMonth()===now.getMonth()&&dt.getFullYear()===now.getFullYear();return dt.getFullYear()===now.getFullYear()};let fC=cargos.filter(fn);let tot=fC.reduce((s,c)=>s+Number(c.total||0),0);let cost=fC.reduce((s,c)=>s+Number(c.cost||0),0);html+=`<h4>تقرير ${type} شحن: ${fC.length} رحلة | شحنا $${tot} | دفعنا $${cost} | <b>فوائد $${tot-cost}</b></h4>`;let fT=ticketsArr.filter(fn);let tTot=fT.reduce((s,t)=>s+Number(t.price||0),0);let tCost=fT.reduce((s,t)=>s+Number(t.cost||0),0);html+=`<h4>تقرير ${type} تذاكر: ${fT.length} | مبيعات $${tTot} | فوائد $${tTot-tCost}</h4>`}
if(type==='cargoTrip'){html=`<h4>كل رحلة شحن - الشركة / اليوم / شحنا / بسعر / دفعنا / الباقي</h4><table><tr style="background:#C1272D;color:#fff"><th>الشركة</th><th>اليوم</th><th>شحنا</th><th>بسعر</th><th>دفعنا</th><th>الباقي</th><th>ملاحظة المالية</th></tr>`;cargos.forEach(c=>{let rem=Number(c.total||0)-Number(c.paid||0);html+=`<tr><td>${escapeHtml(c.company||c.cargoDest)}</td><td>${c.date}</td><td>${escapeHtml(c.sName)} ${c.weight}kg</td><td>$${c.total}</td><td>$${c.cost||0}</td><td style="color:${rem>0?'red':'green'}">$${rem}</td><td contenteditable="true" onblur="saveFinanceNote('cargos','${c.id}',this.innerText)" style="background:#fffbe6">${escapeHtml(c.financeNote||'')}</td></tr>`});html+=`</table>`}
if(type==='ticketTrip'){html=`<h4>كل رحلة تذاكر</h4><table><tr style="background:#00A8D8;color:#fff"><th>الشركة</th><th>اليوم</th><th>الراكب</th><th>بسعر</th><th>دفعنا</th><th>الباقي</th><th>ملاحظة</th></tr>`;ticketsArr.forEach(t=>{let rem=Number(t.price||0)-Number(t.paid||0);html+=`<tr><td>${escapeHtml(t.company||'-')}</td><td>${t.date}</td><td>${escapeHtml(t.pName)}</td><td>$${t.price}</td><td>$${t.cost||0}</td><td>$${rem}</td><td contenteditable="true" onblur="saveFinanceNote('tickets','${t.id}',this.innerText)" style="background:#fffbe6">${escapeHtml(t.financeNote||'')}</td></tr>`});html+=`</table>`}
document.getElementById('reportArea').innerHTML=html};window.saveFinanceNote=async(col,id,note)=>{await updateDoc(doc(db,col,id),{financeNote:note})};window.printReportPDF=()=>{let c=document.getElementById('reportArea').innerHTML;let w=window.open('','','width=1000,height=800');w.document.write(`<html dir="rtl"><head><title>SIDIGI V9.6</title><style>table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:5px}</style></head><body><h2 style="text-align:center">SIDIGI GENERAL TRADING - v9.6 - أرشيف الحسابات</h2><p style="text-align:center">${new Date().toLocaleString()}</p>${c}</body></html>`);w.document.close();w.print()};
</script></body></html>
