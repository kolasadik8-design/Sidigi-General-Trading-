<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIDIGI V9.6 Golden - Full</title>
<style>
:root{--red:#C1272D;--blue:#00A8D8;--dark:#1a1a2e;--gold:#FFD700;--green:#0a7d2e}
body{font-family:Arial;margin:0;background:#f1f5f9}
.topbar{background:var(--dark);color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;padding:16px;border-radius:14px;margin:12px;box-shadow:0 4px 12px rgba(0,0,0,.08);border-right:6px solid var(--red)}
.card-blue{border-right-color:var(--blue)}
.card-gold{border-right-color:var(--gold);border:2px solid var(--gold)}
.btn{background:var(--red);color:#fff;border:none;padding:12px 18px;border-radius:10px;cursor:pointer;font-weight:bold;margin:4px}
.btn-blue{background:var(--blue)}.btn-dark{background:var(--dark)}.btn-green{background:var(--green)}
input,select,textarea{width:100%;padding:11px;margin:5px 0;border-radius:9px;border:1.5px solid #cbd5e1;box-sizing:border-box}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px} th,td{border:1px solid #ddd;padding:7px;text-align:center}
@media print{.no-print{display:none}}
</style>
</head>
<body>
<div class="topbar no-print"><b>SIDIGI GENERAL TRADING <small style="color:var(--gold)">v9.6 FULL</small></b><div><span id="userInfo" style="font-size:12px"></span> <button id="logoutBtn" class="btn btn-dark" style="padding:6px 12px">Logout</button></div></div>

<div style="max-width:1150px;margin:0 auto;padding:8px">

<!-- BOOK CARGO - كامل زي V9.5 -->
<div class="card no-print">
<h3>📦 Book Cargo - شحن جوي</h3>
<div class="grid2">
<select id="cargoDest"></select>
<input id="company" placeholder="Company / شركة الطيران">
</div>
<div class="grid2">
<input id="sName" placeholder="Sender Name * اسم المرسل">
<input id="sPhone" placeholder="Sender Phone تلفون المرسل">
</div>
<div class="grid2">
<input id="rName" placeholder="Receiver Name * اسم المستلم">
<input id="rPhone" placeholder="Receiver Phone تلفون المستلم">
</div>
<div class="grid2">
<input id="weight" type="number" placeholder="Weight kg الوزن">
<input id="desc" placeholder="Description وصف الشحنة">
</div>
<div class="grid2">
<input id="paid" type="number" placeholder="Paid المدفوع">
<input id="cost" type="number" placeholder="Cost تكلفة الشركة">
</div>
<div style="background:#fffbe6;padding:8px;border-radius:8px;margin:6px 0">Price: $<span id="cargoPrice">0</span> | Total: $<b id="cargoTotal">0</b> | Profit: $<span id="cargoProfit">0</span></div>
<button class="btn" id="bookCargoBtn">📦 Book Cargo</button>
</div>

<!-- ISSUE TICKET - كامل -->
<div class="card card-blue no-print">
<h3>✈️ Issue Ticket - تذاكر</h3>
<div class="grid2">
<input id="pName" placeholder="Passenger Name * اسم الراكب">
<input id="airline" placeholder="Airline / الخطوط">
</div>
<div class="grid2">
<input id="fromCity" placeholder="From من">
<input id="toCity" placeholder="To إلى">
</div>
<div class="grid2">
<input id="tDate" type="date">
<input id="tPrice" type="number" placeholder="Price سعر التذكرة">
</div>
<div class="grid2">
<input id="tPaid" type="number" placeholder="Paid المدفوع">
<input id="tCost" type="number" placeholder="Cost تكلفة">
</div>
<button class="btn btn-blue" id="issueTicketBtn">✈️ Issue Ticket</button>
</div>

<!-- SEARCH + ADMIN -->
<div class="card no-print">
<div class="grid2"><input id="searchBox" placeholder="Search بحث..."><button class="btn btn-dark" onclick="renderLists()">Search</button></div>
<div id="adminPanel" style="display:none;margin-top:10px"><h4>Admin Panel</h4><div id="staffList"></div></div>
</div>

<!-- LISTS -->
<div id="lists" class="no-print"></div>

<!-- FINANCE ARCHIVE V9.6 -->
<div id="financeArchive" class="card card-gold no-print" style="display:none">
<h3 style="color:var(--red)">📊 أرشيف الحسابات - مالية ومدير فقط - V9.6</h3>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
<button class="btn" onclick="genReport('weekly')">أسبوعي</button>
<button class="btn" onclick="genReport('monthly')">شهري</button>
<button class="btn" onclick="genReport('yearly')">سنوي</button>
<button class="btn btn-blue" onclick="genReport('cargoTrip')">تفصيلي شحن - الشركة/اليوم/شحنا/بسعر/دفعنا/الباقي</button>
<button class="btn btn-blue" onclick="genReport('ticketTrip')">تفصيلي تذاكر</button>
<button class="btn btn-green" onclick="printReportPDF()">🖨️ طباعة PDF</button>
</div>
<div id="reportArea" style="background:#f8fafc;padding:12px;border-radius:10px;min-height:100px;border:1px dashed #cbd5e1"></div>
</div>

</div>

<!-- PRINT AREAS -->
<div id="cargoPrint" style="display:none"></div>
<div id="ticketPrint" style="display:none"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import {getFirestore,collection,addDoc,getDocs,deleteDoc,doc,updateDoc,query,orderBy} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// ===== حط كونفق حقك من History هنا =====
const firebaseConfig={
apiKey:"AIzaSyDrAyZXWqD3ymYQPxendW9lkynoSiTa0ls"..كمل من History",
authDomain:"sidigi-...firebaseapp.com",
projectId:"sidigi-...",
storageBucket:"sidigi-....appspot.com",
messagingSenderId:"...",
appId:"1:..."
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

function escapeHtml(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
let currentUser=null,currentRole='operations',ships=[],ticketsList=[];
const defaultCargo=[{name:"Maban",price:1.5},{name:"Renk",price:1.5},{name:"Malakal",price:2},{name:"Wau",price:2.5},{name:"Aweil",price:2.5}];

onAuthStateChanged(auth,async(u)=>{
if(!u){location.href='login.html';return}
currentUser=u;
try{
const snap=await getDocs(collection(db,"users"));
let me=snap.docs.find(d=>d.id===u.uid);
if(me)currentRole=me.data().role||'operations';
}catch(e){}
document.getElementById('userInfo').textContent=`${u.email} (${currentRole})`;
if(['admin','finance','manager'].includes(currentRole))document.getElementById('financeArchive').style.display='block';
if(currentRole==='admin')document.getElementById('adminPanel').style.display='block';
loadDestinations();loadOps();loadStaff();
});

document.getElementById('logoutBtn').addEventListener('click',()=>signOut(auth));

async function loadDestinations(){
try{
const s=await getDocs(collection(db,"destinations"));
let list=s.docs.map(d=>({id:d.id,...d.data()}));
if(list.length===0)list=defaultCargo;
document.getElementById('cargoDest').innerHTML=list.map(d=>`<option value="${escapeHtml(d.name)}" data-price="${d.price}">${escapeHtml(d.name)} $${d.price}/kg</option>`).join('');
calcCargo();
}catch(e){document.getElementById('cargoDest').innerHTML=defaultCargo.map(d=>`<option value="${d.name}" data-price="${d.price}">${d.name} $${d.price}/kg</option>`).join('');}
}
window.calcCargo=()=>{
const sel=document.getElementById('cargoDest');
const price=Number(sel.options[sel.selectedIndex]?.dataset.price||0);
const w=Number(document.getElementById('weight').value||0);
const total=price*w;
const cost=Number(document.getElementById('cost').value||0);
document.getElementById('cargoPrice').textContent=price;
document.getElementById('cargoTotal').textContent=total.toFixed(2);
document.getElementById('cargoProfit').textContent=(total-cost).toFixed(2);
};
document.getElementById('cargoDest').addEventListener('change',calcCargo);
document.getElementById('weight').addEventListener('input',calcCargo);
document.getElementById('cost').addEventListener('input',calcCargo);

document.getElementById('bookCargoBtn').addEventListener('click',async()=>{
const data={
cargoDest:document.getElementById('cargoDest').value,
company:document.getElementById('company').value,
sName:document.getElementById('sName').value,
sPhone:document.getElementById('sPhone').value,
rName:document.getElementById('rName').value,
rPhone:document.getElementById('rPhone').value,
weight:Number(document.getElementById('weight').value),
desc:document.getElementById('desc').value,
paid:Number(document.getElementById('paid').value||0),
cost:Number(document.getElementById('cost').value||0),
total:Number(document.getElementById('cargoTotal').textContent||0),
price:Number(document.getElementById('cargoPrice').textContent||0),
date:new Date().toISOString().split('T')[0],
financeNote:"",
createdAt:new Date()
};
if(!data.sName||!data.rName||!data.weight)return alert('Fill required');
await addDoc(collection(db,"cargos"),data);
alert('Cargo Booked');loadOps();
});

document.getElementById('issueTicketBtn').addEventListener('click',async()=>{
const data={
pName:document.getElementById('pName').value,
airline:document.getElementById('airline').value,
company:document.getElementById('airline').value,
from:document.getElementById('fromCity').value,
to:document.getElementById('toCity').value,
date:document.getElementById('tDate').value||new Date().toISOString().split('T')[0],
price:Number(document.getElementById('tPrice').value||0),
paid:Number(document.getElementById('tPaid').value||0),
cost:Number(document.getElementById('tCost').value||0),
financeNote:"",
createdAt:new Date()
};
if(!data.pName)return alert('Passenger required');
await addDoc(collection(db,"tickets"),data);
alert('Ticket Issued');loadOps();
});

async function loadOps(){
try{
const q=await getDocs(query(collection(db,"cargos"),orderBy("createdAt","desc")));
ships=q.docs.map(d=>({id:d.id,...d.data()}));
const t=await getDocs(query(collection(db,"tickets"),orderBy("createdAt","desc")));
ticketsList=t.docs.map(d=>({id:d.id,...d.data()}));
renderLists();
}catch(e){console.log(e)}
}
async function loadStaff(){
try{
const s=await getDocs(collection(db,"users"));
document.getElementById('staffList').innerHTML=s.docs.map(d=>`<div>${d.data().email} - ${d.data().role}</div>`).join('');
}catch(e){}
}

window.renderLists=()=>{
const qq=(document.getElementById('searchBox').value||'').toLowerCase();
let html=`<div class="card"><h3>Cargos (${ships.length})</h3>`;
html+=ships.filter(s=>JSON.stringify(s).toLowerCase().includes(qq)).map(s=>`
<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px">
<span><b>${escapeHtml(s.sName)}</b> → ${escapeHtml(s.rName)} | ${escapeHtml(s.cargoDest)} ${s.company?'/'+escapeHtml(s.company):''} | ${s.weight}kg | $${s.total} | Paid $${s.paid||0} | Cost $${s.cost||0} | ${s.date}</span>
<span style="display:flex;gap:4px"><button class="btn btn-blue" style="padding:4px 8px" onclick="fillCargoPrint('${s.id}')">Print</button><button class="btn" style="padding:4px 8px" onclick="deleteCargo('${s.id}')">X</button></span>
</div>`).join('')+`</div>`;

html+=`<div class="card card-blue"><h3>Tickets (${ticketsList.length})</h3>`;
html+=ticketsList.filter(t=>JSON.stringify(t).toLowerCase().includes(qq)).map(t=>`
<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:8px">
<span><b>${escapeHtml(t.pName)}</b> | ${escapeHtml(t.airline||t.company||'')} | ${t.from||''}→${t.to||''} | $${t.price} | ${t.date}</span>
<span style="display:flex;gap:4px"><button class="btn btn-blue" style="padding:4px 8px" onclick="fillTicketPrint('${t.id}')">Print</button><button class="btn" style="padding:4px 8px" onclick="deleteTicket('${t.id}')">X</button></span>
</div>`).join('')+`</div>`;
document.getElementById('lists').innerHTML=html;
};

window.deleteCargo=async(id)=>{if(!confirm('Delete cargo?'))return;await deleteDoc(doc(db,"cargos",id));loadOps();};
window.deleteTicket=async(id)=>{if(!confirm('Delete ticket?'))return;await deleteDoc(doc(db,"tickets",id));loadOps();};
window.fillCargoPrint=(id)=>{const s=ships.find(x=>x.id===id);if(!s)return;document.getElementById('cargoPrint').innerHTML=`<h2>CARGO RECEIPT</h2><p>${s.sName} → ${s.rName} | ${s.cargoDest} | ${s.weight}kg | $${s.total}</p>`;window.print();};
window.fillTicketPrint=(id)=>{const t=ticketsList.find(x=>x.id===id);if(!t)return;document.getElementById('ticketPrint').innerHTML=`<h2>TICKET</h2><p>${t.pName} | ${t.airline} | $${t.price}</p>`;window.print();};

// ===== V9.6 REPORTS - كامل =====
window.genReport=async(type)=>{
if(!['admin','finance','manager'].includes(currentRole)){alert('⛔ للمالية والمدير فقط');return}
const cSnap=await getDocs(collection(db,"cargos"));
const tSnap=await getDocs(collection(db,"tickets"));
let cargos=[];cSnap.forEach(d=>cargos.push({id:d.id,...d.data()}));
let ticketsArr=[];tSnap.forEach(d=>ticketsArr.push({id:d.id,...d.data()}));
let now=new Date();let html="";
if(['weekly','monthly','yearly'].includes(type)){
let fn=(d)=>{let dt=d.createdAt?.toDate?d.createdAt.toDate():new Date(d.date);if(isNaN(dt))return false;if(type==='weekly')return(now-dt)/(1000*60*60*24)<=7;if(type==='monthly')return dt.getMonth()===now.getMonth()&&dt.getFullYear()===now.getFullYear();return dt.getFullYear()===now.getFullYear()};
let fC=cargos.filter(fn);let tot=fC.reduce((s,c)=>s+Number(c.total||c.price||0),0);let cost=fC.reduce((s,c)=>s+Number(c.cost||0),0);
html+=`<h4>📦 تقرير ${type} - شحن</h4><p>الرحلات: ${fC.length} | اجمالي الشحن: $${tot} | دفعنا: $${cost} | <b style="color:green">الفوائد: $${tot-cost}</b></p><hr>`;
let fT=ticketsArr.filter(fn);let tTot=fT.reduce((s,t)=>s+Number(t.price||0),0);let tCost=fT.reduce((s,t)=>s+Number(t.cost||0),0);
html+=`<h4>✈️ تقرير ${type} - تذاكر</h4><p>التذاكر: ${fT.length} | المبيعات: $${tTot} | <b style="color:green">فوائد: $${tTot-tCost}</b></p>`;
}
if(type==='cargoTrip'){
html=`<h4>تقرير كل رحلة شحن - الشركة / اليوم / شحنا / بسعر / دفعنا / الباقي</h4>
<table><tr style="background:#C1272D;color:#fff"><th>الشركة</th><th>اليوم</th><th>شحنا (مرسل→مستلم)</th><th>الوزن</th><th>بسعر</th><th>دفعنا</th><th>الباقي</th><th>ملاحظة المالية/المدير</th></tr>`;
cargos.forEach(c=>{let remain=Number(c.total||0)-Number(c.paid||0);html+=`<tr><td>${escapeHtml(c.company||c.cargoDest||'-')}</td><td>${escapeHtml(c.date||'-')}</td><td>${escapeHtml(c.sName||'')}→${escapeHtml(c.rName||'')}</td><td>${c.weight||0}kg</td><td>$${c.total||0}</td><td>$${c.cost||0}</td><td style="color:${remain>0?'red':'green'};font-weight:bold">$${remain} ${remain>0?'باقي':''}</td><td contenteditable="true" onblur="saveFinanceNote('cargos','${c.id}',this.innerText)" style="background:#fffbe6;min-width:120px">${escapeHtml(c.financeNote||'تكتبها المالية')}</td></tr>`});html+=`</table>`;
}
if(type==='ticketTrip'){
html=`<h4>تقرير كل رحلة تذاكر</h4><table><tr style="background:#00A8D8;color:#fff"><th>الشركة/الخطوط</th><th>اليوم</th><th>الراكب</th><th>المسار</th><th>بسعر</th><th>دفعنا</th><th>الباقي</th><th>ملاحظة</th></tr>`;
ticketsArr.forEach(t=>{let remain=Number(t.price||0)-Number(t.paid||0);html+=`<tr><td>${escapeHtml(t.company||t.airline||'-')}</td><td>${escapeHtml(t.date||'-')}</td><td>${escapeHtml(t.pName||'-')}</td><td>${escapeHtml(t.from||'')}-${escapeHtml(t.to||'')}</td><td>$${t.price||0}</td><td>$${t.cost||0}</td><td style="color:${remain>0?'red':'green'}">$${remain}</td><td contenteditable="true" onblur="saveFinanceNote('tickets','${t.id}',this.innerText)" style="background:#fffbe6">${escapeHtml(t.financeNote||'')}</td></tr>`});html+=`</table>`;
}
document.getElementById('reportArea').innerHTML=html;
};
window.saveFinanceNote=async(col,id,note)=>{await updateDoc(doc(db,col,id),{financeNote:note});};
window.printReportPDF=()=>{
let area=document.getElementById('reportArea');
if(!area.innerHTML.trim()){alert('أول دوس أسبوعي / شهري / تفصيلي عشان يظهر التقرير');return;}
let w=window.open('','','width=1100,height=800');
w.document.write(`<html dir="rtl"><head><title>SIDIGI V9.6 Report</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ccc;padding:6px;text-align:center}h2{color:#C1272D}</style></head><body><h2 style="text-align:center">SIDIGI GENERAL TRADING - V9.6 Golden<br>أرشيف الحسابات</h2><p style="text-align:center">${new Date().toLocaleString('ar-SD')}</p>${area.innerHTML}<br><br><div style="display:flex;justify-content:space-around;margin-top:40px"><span>توقيع المالية: __________</span><span>توقيع المدير: __________</span></div></body></html>`);
w.document.close();w.focus();setTimeout(()=>w.print(),500);
};
</script>
</body>
</html>
